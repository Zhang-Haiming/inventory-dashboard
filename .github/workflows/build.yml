name: Build Desktop App

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这样的 tag 时触发
  workflow_dispatch:  # 也可以在 GitHub 页面手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (静态导出)
        run: |
          mv app/api app/_api_disabled
          npm run build
          mv app/_api_disabled app/api
        env:
          NEXT_PUBLIC_GH_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          NEXT_PUBLIC_GH_OWNER: ${{ secrets.APP_GITHUB_OWNER }}
          NEXT_PUBLIC_GH_REPO: ${{ secrets.APP_GITHUB_REPO }}

      - name: Build Electron (Windows)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (静态导出)
        run: |
          mv app/api app/_api_disabled
          npm run build
          mv app/_api_disabled app/api
        env:
          NEXT_PUBLIC_GH_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          NEXT_PUBLIC_GH_OWNER: ${{ secrets.APP_GITHUB_OWNER }}
          NEXT_PUBLIC_GH_REPO: ${{ secrets.APP_GITHUB_REPO }}

      - name: Build Electron (Mac)
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 禁止自动寻找签名证书

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          retention-days: 30

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/

      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: 库存看板 ${{ github.ref_name }}
          body: |
            ## 下载安装

            | 系统 | 文件 |
            |------|------|
            | Windows | `库存看板 Setup x.x.x.exe` |
            | macOS | `库存看板-x.x.x.dmg` |

            ## 安装说明

            **Windows：**
            1. 下载 `.exe`，双击安装
            2. 完成后打开桌面「库存看板」图标

            **macOS：**
            1. 下载 `.dmg`，双击打开，把「库存看板」拖到 Applications
            2. **首次打开必做**（因为未购买苹果开发者证书，需手动解除限制）：
               打开「终端」，粘贴以下命令并回车：
               ```
               xattr -cr /Applications/库存看板.app
               ```
            3. 之后每次正常双击图标即可，无需重复上述操作
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
