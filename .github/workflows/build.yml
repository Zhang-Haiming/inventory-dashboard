name: Build Windows App

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这样的 tag 时触发
  workflow_dispatch:  # 也可以在 GitHub 页面手动触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .env file
        # 把 Vercel 上配置的 Secrets 写入 .env.production
        run: |
          echo "GITHUB_TOKEN=${{ secrets.APP_GITHUB_TOKEN }}" >> .env.production
          echo "GITHUB_OWNER=${{ secrets.APP_GITHUB_OWNER }}" >> .env.production
          echo "GITHUB_REPO=${{ secrets.APP_GITHUB_REPO }}" >> .env.production
        shell: bash

      - name: Build Next.js
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ secrets.APP_GITHUB_OWNER }}
          GITHUB_REPO: ${{ secrets.APP_GITHUB_REPO }}

      - name: Build Electron (Windows)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          name: 库存看板 ${{ github.ref_name }}
          body: |
            ## 安装说明
            1. 下载 `库存看板 Setup x.x.x.exe`
            2. 双击安装
            3. 打开桌面上的「库存看板」图标
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
