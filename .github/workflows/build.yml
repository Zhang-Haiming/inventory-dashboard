name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build Next.js (静态导出)
        run: |
          mv app/api app/_api_disabled
          npm run build
          mv app/_api_disabled app/api
        env:
          NEXT_PUBLIC_GH_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          NEXT_PUBLIC_GH_OWNER: ${{ secrets.APP_GITHUB_OWNER }}
          NEXT_PUBLIC_GH_REPO: ${{ secrets.APP_GITHUB_REPO }}
      - name: Build Electron (Windows x64)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename x64 installer
        run: |
          cd dist
          for f in *.exe; do
            mv "$f" "${f%.exe} x64.exe"
          done
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          retention-days: 30

  build-windows-ia32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build Next.js (静态导出)
        run: |
          mv app/api app/_api_disabled
          npm run build
          mv app/_api_disabled app/api
        env:
          NEXT_PUBLIC_GH_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          NEXT_PUBLIC_GH_OWNER: ${{ secrets.APP_GITHUB_OWNER }}
          NEXT_PUBLIC_GH_REPO: ${{ secrets.APP_GITHUB_REPO }}
      - name: Build Electron (Windows 32位)
        run: npx electron-builder --win --ia32 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename ia32 installer
        run: |
          cd dist
          for f in *.exe; do
            mv "$f" "${f%.exe} 32bit.exe"
          done
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ia32
          path: dist/*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build Next.js (静态导出)
        run: |
          mv app/api app/_api_disabled
          npm run build
          mv app/_api_disabled app/api
        env:
          NEXT_PUBLIC_GH_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          NEXT_PUBLIC_GH_OWNER: ${{ secrets.APP_GITHUB_OWNER }}
          NEXT_PUBLIC_GH_REPO: ${{ secrets.APP_GITHUB_REPO }}
      - name: Build Electron (Mac)
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          retention-days: 30

  release:
    needs: [build-windows-x64, build-windows-ia32, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist/x64/

      - uses: actions/download-artifact@v4
        with:
          name: windows-ia32
          path: dist/ia32/

      - uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist/mac/

      # 把所有文件移到同一目录供上传
      - name: Merge artifacts
        run: |
          mkdir -p dist/release
          mv dist/x64/*.exe  dist/release/ 2>/dev/null || true
          mv dist/ia32/*.exe dist/release/ 2>/dev/null || true
          mv dist/mac/*.dmg  dist/release/ 2>/dev/null || true
          ls -lh dist/release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          name: 库存看板 ${{ github.ref_name }}
          body: |
            ## 下载安装

            | 系统 | 文件 |
            |------|------|
            | Windows 64位 | `库存看板 Setup x.x.x x64.exe` |
            | Windows 32位 | `库存看板 Setup x.x.x 32bit.exe` |
            | macOS (Apple Silicon / Intel) | `库存看板-x.x.x-arm64.dmg` |

            ## 安装说明

            **Windows：**
            1. 根据系统位数下载对应 `.exe`（不确定选 32位，向下兼容）
            2. 双击安装，若弹出蓝色 SmartScreen 警告点「更多信息」→「仍要运行」
            3. 完成后打开桌面「库存看板」图标

            **macOS：**
            1. 下载 `.dmg`，双击打开，把「库存看板」拖到 Applications
            2. **首次打开必做**：打开「终端」运行以下命令：
               ```
               xattr -cr /Applications/库存看板.app
               ```
            3. 之后每次正常双击图标即可
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
